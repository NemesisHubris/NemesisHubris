name: Profile cards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, readme-refresh]
    paths: ['.github/workflows/profile.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

env:
  # Optional: add a classic PAT (repo + read:user) as secret STATS_TOKEN to count private repos.
  STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
  CARD_OPTS: bg_color=070b14&border_color=1c2433&title_color=e6edf3&icon_color=3fb950&text_color=aab4c3&ring_color=3fb950&hide_border=false&border_radius=10&disable_animations=true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=330&hide_progress=false&${{ env.CARD_OPTS }}
          path: profile/top-langs.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#d29922&color_dots=#0f1623,#0e4429,#006d32,#26a641,#39d353
            profile/snake-dark.svg?palette=github-dark&color_snake=#d29922&color_dots=#0f1623,#0e4429,#006d32,#26a641,#39d353

      - name: Contribution chart and streaks
        env:
          GH_TOKEN: ${{ env.STATS_TOKEN }}
        run: python3 profile/build_chart.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git pull --rebase -q origin ${{ github.ref_name }}
          git push

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable profile.yml || true
